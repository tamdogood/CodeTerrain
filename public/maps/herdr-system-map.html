.form-switch .form-check-input:disabled,

  left: 0;

  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);

.form-switch .form-check-input:checked {

.form-switch .form-check-input:checked::before {

.form-range::-moz-range-track {

.form-range::-moz-range-thumb {

            &#x27;&lt;polygon class=&quot;face-side&quot; points=&quot;31,-62 0,-46 0,-35 31,-51&quot;&gt;&lt;/polygon&gt;&#x27; +
            &#x27;&lt;path class=&quot;building-line&quot; d=&quot;M-31-62-31-45M31-62 31-45M-31-56C-16-40 16-40 31-56&quot;&gt;&lt;/path&gt;&#x27;,
          depot:
            &#x27;&lt;polygon class=&quot;face-top&quot; points=&quot;-43,-37 0,-60 43,-37 0,-14&quot;&gt;&lt;/polygon&gt;&#x27; +

            &#x27;&lt;path class=&quot;building-line&quot; d=&quot;M2-94C17-92 24-83 24-73M-32-27-7-14M10-17 34-30&quot;&gt;&lt;/path&gt;&#x27;
        };

      }

      function renderGrid() {
        var html = &#x27;&lt;polygon class=&quot;ground&quot; points=&quot;&#x27; + points([[0, 0], [6, 0], [6, 6], [0, 6]]) + &#x27;&quot;&gt;&lt;/polygon&gt;&#x27;;
        var index;
        for (index = 0; index &lt;= 6; index += 1) {
          html += &#x27;&lt;path class=&quot;grid-line&quot; d=&quot;M&#x27; + project(index, 0).x + &#x27; &#x27; + project(index, 0).y + &#x27;L&#x27; + project(index, 6).x + &#x27; &#x27; + project(index, 6).y + &#x27;&quot;&gt;&lt;/path&gt;&#x27;;
          html += &#x27;&lt;path class=&quot;grid-line&quot; d=&quot;M&#x27; + project(0, index).x + &#x27; &#x27; + project(0, index).y + &#x27;L&#x27; + project(6, index).x + &#x27; &#x27; + project(6, index).y + &#x27;&quot;&gt;&lt;/path&gt;&#x27;;
        }
        html += &#x27;&lt;text class=&quot;district-label&quot; x=&quot;130&quot; y=&quot;195&quot;&gt;HOST + IPC&lt;/text&gt;&#x27;;
        html += &#x27;&lt;text class=&quot;district-label&quot; x=&quot;555&quot; y=&quot;185&quot;&gt;SERVER CORE&lt;/text&gt;&#x27;;
        html += &#x27;&lt;text class=&quot;district-label&quot; x=&quot;690&quot; y=&quot;505&quot;&gt;CHILD RUNTIME&lt;/text&gt;&#x27;;
        html += &#x27;&lt;text class=&quot;district-label&quot; x=&quot;195&quot; y=&quot;510&quot;&gt;DURABLE STATE&lt;/text&gt;&#x27;;
        gridLayer.innerHTML = html;
      }

      function routePath(edge) {
        var from = positions[edge.from];
        var to = positions[edge.to];
        var start = { x: from.x, y: from.y - 18 };
        var end = { x: to.x, y: to.y - 18 };
        var dx = end.x - start.x;
        var dy = end.y - start.y;
        var length = Math.max(1, Math.sqrt(dx * dx + dy * dy));
        var normalX = -dy / length;
        var normalY = dx / length;
        var midX = (start.x + end.x) / 2 + normalX * (edge.curve || 0);
        var midY = (start.y + end.y) / 2 + normalY * (edge.curve || 0);
        return &#x27;M&#x27; + start.x + &#x27; &#x27; + start.y + &#x27; Q&#x27; + midX.toFixed(1) + &#x27; &#x27; + midY.toFixed(1) + &#x27; &#x27; + end.x + &#x27; &#x27; + end.y;
      }

      function renderRoutes() {
        routeLayer.innerHTML = edges.map(function (edge) {
          var title = edgeById[edge.id].name || (nodeById[edge.from].name + &#x27; to &#x27; + nodeById[edge.to].name);
          return &#x27;&lt;a class=&quot;route-link kind-&#x27; + edge.kind + &#x27;&quot; id=&quot;herdr-route-link-&#x27; + edge.id + &#x27;&quot; href=&quot;#herdr-flow-&#x27; + edge.id + &#x27;&quot; data-edge=&quot;&#x27; + edge.id + &#x27;&quot; aria-label=&quot;&#x27; + escapeHtml(title + &#x27;: &#x27; + edge.payload) + &#x27;&quot; style=&quot;--route-color:&#x27; + categoryColor[edge.color] + &#x27;&quot;&gt;&#x27; +
            &#x27;&lt;title&gt;&#x27; + escapeHtml(edge.payload) + &#x27;&lt;/title&gt;&#x27; +
            &#x27;&lt;path class=&quot;route-hit&quot; d=&quot;&#x27; + routePath(edge) + &#x27;&quot;&gt;&lt;/path&gt;&#x27; +
            &#x27;&lt;path class=&quot;route&quot; id=&quot;herdr-route-&#x27; + edge.id + &#x27;&quot; d=&quot;&#x27; + routePath(edge) + &#x27;&quot;&gt;&lt;/path&gt;&#x27; +
            &#x27;&lt;text class=&quot;route-caption&quot; id=&quot;herdr-caption-&#x27; + edge.id + &#x27;&quot;&gt;&#x27; + escapeHtml(edge.label) + &#x27;&lt;/text&gt;&#x27; +
            &#x27;&lt;/a&gt;&#x27;;
        }).join(&#x27;&#x27;);

        edges.forEach(function (edge) {
          var path = document.getElementById(&#x27;herdr-route-&#x27; + edge.id);
          var caption = document.getElementById(&#x27;herdr-caption-&#x27; + edge.id);
          var point = path.getPointAtLength(path.getTotalLength() * 0.52);
          caption.setAttribute(&#x27;x&#x27;, point.x);
          caption.setAttribute(&#x27;y&#x27;, point.y - 8);
        });
      }

      function renderBuildings() {
        var orderedNodes = nodes.slice().sort(function (left, right) {
          return positions[left.id].y - positions[right.id].y;
        });
        buildingLayer.innerHTML = orderedNodes.map(function (node) {
          var position = positions[node.id];
          var label = node.label.map(function (line, index) {
            return &#x27;&lt;tspan x=&quot;0&quot; dy=&quot;&#x27; + (index === 0 ? 0 : 15) + &#x27;&quot;&gt;&#x27; + escapeHtml(line) + &#x27;&lt;/tspan&gt;&#x27;;
          }).join(&#x27;&#x27;);
          return &#x27;&lt;a class=&quot;node&quot; id=&quot;herdr-node-link-&#x27; + node.id + &#x27;&quot; href=&quot;#herdr-node-&#x27; + node.id + &#x27;&quot; data-node=&quot;&#x27; + node.id + &#x27;&quot; aria-label=&quot;&#x27; + escapeHtml(node.name + &#x27;. &#x27; + node.summary) + &#x27;&quot; transform=&quot;translate(&#x27; + position.x + &#x27; &#x27; + position.y + &#x27;)&quot; style=&quot;--node-color:&#x27; + categoryColor[node.category] + &#x27;&quot;&gt;&#x27; +
            &#x27;&lt;title&gt;&#x27; + escapeHtml(node.name + &#x27;: &#x27; + node.summary) + &#x27;&lt;/title&gt;&#x27; +
            &#x27;&lt;g class=&quot;node-visual&quot;&gt;&#x27; + shapeMarkup(node.shape) + &#x27;&lt;/g&gt;&#x27; +
            &#x27;&lt;text class=&quot;node-label&quot; y=&quot;44&quot;&gt;&#x27; + label + &#x27;&lt;/text&gt;&#x27; +
            &#x27;&lt;text class=&quot;node-meta&quot; x=&quot;0&quot; y=&quot;&#x27; + (node.label.length &gt; 1 ? 77 : 62) + &#x27;&quot;&gt;&#x27; + escapeHtml(node.category) + &#x27;&lt;/text&gt;&#x27; +
            &#x27;&lt;/a&gt;&#x27;;
        }).join(&#x27;&#x27;);
      }

      function renderSources(sourceKeys) {
        var seen = {};
        var items = sourceKeys.filter(function (key) {
          if (seen[key]) {
            return false;
          }
          seen[key] = true;
          return true;
        }).map(function (key) {
          var source = sourceIndex[key];
          return &#x27;&lt;li&gt;&lt;a href=&quot;&#x27; + COMMIT_BASE + source.path + &#x27;&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;&#x27; + escapeHtml(source.label) + &#x27; ↗&lt;/a&gt;&lt;/li&gt;&#x27;;
        }).join(&#x27;&#x27;);
        return &#x27;&lt;ul class=&quot;source-list&quot;&gt;&#x27; + items + &#x27;&lt;/ul&gt;&#x27;;
      }

      function bindPanelButtons() {
        panel.querySelectorAll(&#x27;[data-panel-edge]&#x27;).forEach(function (button) {
          button.addEventListener(&#x27;click&#x27;, function () {
            selectEdge(button.getAttribute(&#x27;data-panel-edge&#x27;));
          });
        });
        var back = panel.querySelector(&#x27;[data-panel-back]&#x27;);
        if (back) {
          back.addEventListener(&#x27;click&#x27;, function () {
            clearSelection();
            renderJourneyPanel(mapState.journey);
          });
        }
      }

      function renderJourneyPanel(journeyId) {
        var journey = journeys[journeyId];
        var steps = journey.edges.map(function (edgeId, index) {
          var edge = edgeById[edgeId];
          return &#x27;&lt;li&gt;&lt;button class=&quot;trace-button&quot; type=&quot;button&quot; data-panel-edge=&quot;&#x27; + edge.id + &#x27;&quot;&gt;&#x27; +
            &#x27;&lt;span class=&quot;trace-number&quot;&gt;&#x27; + (index + 1) + &#x27;&lt;/span&gt;&#x27; +
            &#x27;&lt;span class=&quot;trace-title&quot;&gt;&#x27; + escapeHtml(nodeById[edge.from].name + &#x27; → &#x27; + nodeById[edge.to].name) + &#x27;&lt;/span&gt;&#x27; +
            &#x27;&lt;span class=&quot;trace-payload&quot;&gt;&#x27; + escapeHtml(edge.payload) + &#x27;&lt;/span&gt;&#x27; +
            &#x27;&lt;/button&gt;&lt;/li&gt;&#x27;;
        }).join(&#x27;&#x27;);
        panel.innerHTML =
          &#x27;&lt;p class=&quot;panel-kicker&quot;&gt;&#x27; + escapeHtml(journey.kicker) + &#x27;&lt;/p&gt;&#x27; +
          &#x27;&lt;h2&gt;&#x27; + escapeHtml(journey.title) + &#x27;&lt;/h2&gt;&#x27; +
          &#x27;&lt;p class=&quot;panel-summary&quot;&gt;&#x27; + escapeHtml(journey.summary) + &#x27;&lt;/p&gt;&#x27; +
          &#x27;&lt;ol class=&quot;trace-list&quot;&gt;&#x27; + steps + &#x27;&lt;/ol&gt;&#x27; +
          &#x27;&lt;h3&gt;Source entry points&lt;/h3&gt;&#x27; +
          renderSources(journey.sources);
        bindPanelButtons();
      }

      function renderNodePanel(nodeId) {
        var node = nodeById[nodeId];
        panel.innerHTML =
          &#x27;&lt;button class=&quot;btn btn-ghost back-button&quot; type=&quot;button&quot; data-panel-back&gt;← Back to journey&lt;/button&gt;&#x27; +
          &#x27;&lt;p class=&quot;panel-kicker&quot;&gt;&#x27; + escapeHtml(node.category + &#x27; building&#x27;) + &#x27;&lt;/p&gt;&#x27; +
          &#x27;&lt;h2&gt;&#x27; + escapeHtml(node.name) + &#x27;&lt;/h2&gt;&#x27; +
          &#x27;&lt;p class=&quot;panel-summary&quot;&gt;&#x27; + escapeHtml(node.summary) + &#x27;&lt;/p&gt;&#x27; +
          &#x27;&lt;dl class=&quot;fact-list&quot;&gt;&#x27; +
            &#x27;&lt;div&gt;&lt;dt&gt;Owns&lt;/dt&gt;&lt;dd&gt;&#x27; + escapeHtml(node.owns) + &#x27;&lt;/dd&gt;&lt;/div&gt;&#x27; +
            &#x27;&lt;div&gt;&lt;dt&gt;Receives&lt;/dt&gt;&lt;dd&gt;&#x27; + escapeHtml(node.receives) + &#x27;&lt;/dd&gt;&lt;/div&gt;&#x27; +
            &#x27;&lt;div&gt;&lt;dt&gt;Emits&lt;/dt&gt;&lt;dd&gt;&#x27; + escapeHtml(node.emits) + &#x27;&lt;/dd&gt;&lt;/div&gt;&#x27; +
          &#x27;&lt;/dl&gt;&#x27; +
          &#x27;&lt;h3&gt;Source evidence&lt;/h3&gt;&#x27; +
          renderSources(node.sources);
        bindPanelButtons();
      }

      function renderEdgePanel(edgeId) {
        var edge = edgeById[edgeId];
        var journeyNames = Object.keys(journeys).filter(function (key) {
          return key !== &#x27;overview&#x27; &amp;&amp; journeys[key].edges.indexOf(edgeId) !== -1;
        }).map(function (key) {
          return journeys[key].title;
        }).join(&#x27;; &#x27;);
        panel.innerHTML =
          &#x27;&lt;button class=&quot;btn btn-ghost back-button&quot; type=&quot;button&quot; data-panel-back&gt;← Back to journey&lt;/button&gt;&#x27; +
          &#x27;&lt;p class=&quot;panel-kicker&quot;&gt;&#x27; + escapeHtml(edge.kind + &#x27; route&#x27;) + &#x27;&lt;/p&gt;&#x27; +
          &#x27;&lt;h2&gt;&#x27; + escapeHtml(nodeById[edge.from].name + &#x27; → &#x27; + nodeById[edge.to].name) + &#x27;&lt;/h2&gt;&#x27; +
          &#x27;&lt;p class=&quot;panel-summary&quot;&gt;&#x27; + escapeHtml(edge.summary) + &#x27;&lt;/p&gt;&#x27; +
          &#x27;&lt;code class=&quot;payload&quot;&gt;&#x27; + escapeHtml(edge.payload) + &#x27;&lt;/code&gt;&#x27; +
          &#x27;&lt;dl class=&quot;fact-list&quot;&gt;&#x27; +
            &#x27;&lt;div&gt;&lt;dt&gt;Boundary&lt;/dt&gt;&lt;dd&gt;&#x27; + escapeHtml(edge.kind === &#x27;durable&#x27; ? &#x27;Durable file or network acquisition&#x27; : edge.kind === &#x27;data&#x27; ? &#x27;Runtime data plane&#x27; : &#x27;Control plane&#x27;) + &#x27;&lt;/dd&gt;&lt;/div&gt;&#x27; +
            &#x27;&lt;div&gt;&lt;dt&gt;Used by&lt;/dt&gt;&lt;dd&gt;&#x27; + escapeHtml(journeyNames || &#x27;Architecture overview&#x27;) + &#x27;&lt;/dd&gt;&lt;/div&gt;&#x27; +
          &#x27;&lt;/dl&gt;&#x27; +
          &#x27;&lt;h3&gt;Source evidence&lt;/h3&gt;&#x27; +
          renderSources(edge.sources);
        bindPanelButtons();
      }

      function updateSelectionClasses() {
        root.querySelectorAll(&#x27;.node.is-selected, .route-link.is-selected&#x27;).forEach(function (element) {
          element.classList.remove(&#x27;is-selected&#x27;);
          element.removeAttribute(&#x27;aria-current&#x27;);
        });
        if (mapState.selectionType === &#x27;node&#x27;) {
          var nodeLink = document.getElementById(&#x27;herdr-node-link-&#x27; + mapState.selectionId);
          nodeLink.classList.add(&#x27;is-selected&#x27;);
          nodeLink.setAttribute(&#x27;aria-current&#x27;, &#x27;true&#x27;);
        }
        if (mapState.selectionType === &#x27;edge&#x27;) {
          var routeLink = document.getElementById(&#x27;herdr-route-link-&#x27; + mapState.selectionId);
          routeLink.classList.add(&#x27;is-selected&#x27;);
          routeLink.setAttribute(&#x27;aria-current&#x27;, &#x27;true&#x27;);
        }
      }

      function selectNode(nodeId) {
        mapState.selectionType = &#x27;node&#x27;;
        mapState.selectionId = nodeId;
        updateSelectionClasses();
        renderNodePanel(nodeId);
      }

      function selectEdge(edgeId) {
        mapState.selectionType = &#x27;edge&#x27;;
        mapState.selectionId = edgeId;
        updateSelectionClasses();
        renderEdgePanel(edgeId);
      }

      function clearSelection() {
        mapState.selectionType = null;
        mapState.selectionId = null;
        updateSelectionClasses();
      }

      function rebuildPackets() {
        packetLayer.innerHTML = &#x27;&#x27;;
        particles = [];
        if (mapState.journey === &#x27;overview&#x27;) {
          return;
        }
        journeys[mapState.journey].edges.forEach(function (edgeId, index) {
          var edge = edgeById[edgeId];
          var path = document.getElementById(&#x27;herdr-route-&#x27; + edgeId);
          var circle = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;circle&#x27;);
          circle.setAttribute(&#x27;class&#x27;, &#x27;packet&#x27;);
          circle.setAttribute(&#x27;r&#x27;, edge.kind === &#x27;durable&#x27; ? &#x27;4.5&#x27; : &#x27;3.8&#x27;);
          circle.style.setProperty(&#x27;--route-color&#x27;, categoryColor[edge.color]);
          packetLayer.appendChild(circle);
          particles.push({
            element: circle,
            path: path,
            phase: (index * 0.17) % 1,
            speed: 0.000075 + (index % 3) * 0.000008
          });
        });
      }

      function applyJourney(journeyId) {
        mapState.journey = journeyId;
        journeySelect.value = journeyId;
        clearSelection();
        var activeEdges = {};
        var activeNodes = {};
        journeys[journeyId].edges.forEach(function (edgeId) {
          var edge = edgeById[edgeId];
          activeEdges[edgeId] = true;
          activeNodes[edge.from] = true;
          activeNodes[edge.to] = true;
        });
        routeLayer.querySelectorAll(&#x27;.route-link&#x27;).forEach(function (link) {
          link.classList.toggle(&#x27;is-in-journey&#x27;, Boolean(activeEdges[link.getAttribute(&#x27;data-edge&#x27;)]));
        });
        buildingLayer.querySelectorAll(&#x27;.node&#x27;).forEach(function (link) {
          link.classList.toggle(&#x27;is-dimmed&#x27;, journeyId !== &#x27;overview&#x27; &amp;&amp; !activeNodes[link.getAttribute(&#x27;data-node&#x27;)]);
        });
        renderJourneyPanel(journeyId);
        rebuildPackets();
      }

      function setPlaying(playing) {
        mapState.playing = playing;
        trafficButton.setAttribute(&#x27;aria-pressed&#x27;, String(playing));
        trafficButton.textContent = playing ? &#x27;Pause traffic&#x27; : &#x27;Play traffic&#x27;;
        packetLayer.style.opacity = playing ? &#x27;1&#x27; : &#x27;0.45&#x27;;
      }

      function setZoom(value) {
        var zoom = Number(value);
        var width = 1000 * 100 / zoom;
        var height = 650 * 100 / zoom;
        var x = (1000 - width) / 2;
        var y = (650 - height) / 2;
        svg.setAttribute(&#x27;viewBox&#x27;, x.toFixed(1) + &#x27; &#x27; + y.toFixed(1) + &#x27; &#x27; + width.toFixed(1) + &#x27; &#x27; + height.toFixed(1));
        zoomInput.value = String(zoom);
        zoomOutput.textContent = zoom + &#x27;%&#x27;;
      }

      function animate(time) {
        if (mapState.playing) {
          particles.forEach(function (particle) {
            var progress = (time * particle.speed + particle.phase) % 1;
            var point = particle.path.getPointAtLength(particle.path.getTotalLength() * progress);
            particle.element.setAttribute(&#x27;cx&#x27;, point.x);
            particle.element.setAttribute(&#x27;cy&#x27;, point.y);
          });
        }
        window.requestAnimationFrame(animate);
      }

      function validateModel() {
        var nodeIds = {};
        var edgeIds = {};
        nodes.forEach(function (node) {
          if (nodeIds[node.id]) {
            throw new Error(&#x27;Duplicate Herdr map node: &#x27; + node.id);
          }
          nodeIds[node.id] = true;
          node.sources.forEach(function (source) {
            if (!sourceIndex[source]) {
              throw new Error(&#x27;Unknown source &#x27; + source + &#x27; on node &#x27; + node.id);
            }
          });
        });
        edges.forEach(function (edge) {
          if (edgeIds[edge.id]) {
            throw new Error(&#x27;Duplicate Herdr map edge: &#x27; + edge.id);
          }
          if (!nodeIds[edge.from] || !nodeIds[edge.to]) {
            throw new Error(&#x27;Broken Herdr map edge: &#x27; + edge.id);
          }
          edgeIds[edge.id] = true;
          edge.sources.forEach(function (source) {
            if (!sourceIndex[source]) {
              throw new Error(&#x27;Unknown source &#x27; + source + &#x27; on edge &#x27; + edge.id);
            }
          });
        });
        Object.keys(journeys).forEach(function (journeyId) {
          journeys[journeyId].edges.forEach(function (edgeId) {
            if (!edgeIds[edgeId]) {
              throw new Error(&#x27;Unknown edge &#x27; + edgeId + &#x27; in journey &#x27; + journeyId);
            }
          });
          journeys[journeyId].sources.forEach(function (source) {
            if (!sourceIndex[source]) {
              throw new Error(&#x27;Unknown source &#x27; + source + &#x27; in journey &#x27; + journeyId);
            }
          });
        });
        return true;
      }

      function validateUi() {
        try {
          journeySelect.value = &#x27;detection&#x27;;
          journeySelect.dispatchEvent(new Event(&#x27;change&#x27;, { bubbles: true }));
          if (!document.getElementById(&#x27;herdr-route-link-vt-state&#x27;).classList.contains(&#x27;is-in-journey&#x27;)) {
            throw new Error(&#x27;Journey selection did not activate a route&#x27;);
          }
          document.getElementById(&#x27;herdr-route-link-vt-state&#x27;).dispatchEvent(new MouseEvent(&#x27;click&#x27;, { bubbles: true, cancelable: true }));
          if (mapState.selectionId !== &#x27;vt-state&#x27; || panel.querySelector(&#x27;h2&#x27;).textContent.indexOf(&#x27;Ghostty VT&#x27;) === -1) {
            throw new Error(&#x27;Route selection did not update the explainer&#x27;);
          }
          document.getElementById(&#x27;herdr-node-link-server&#x27;).dispatchEvent(new MouseEvent(&#x27;click&#x27;, { bubbles: true, cancelable: true }));
          if (mapState.selectionId !== &#x27;server&#x27; || panel.textContent.indexOf(&#x27;Headless server&#x27;) === -1) {
            throw new Error(&#x27;Building selection did not update the explainer&#x27;);
          }
          return true;
        } finally {
          resetButton.click();
        }
      }

      nodes.forEach(function (node) {
        nodeById[node.id] = node;
        positions[node.id] = project(node.gx, node.gy);
      });
      edges.forEach(function (edge) {
        edgeById[edge.id] = edge;
        edge.name = nodeById[edge.from].name + &#x27; → &#x27; + nodeById[edge.to].name;
      });

      root.dataset.selfCheck = validateModel() ? &#x27;passed&#x27; : &#x27;failed&#x27;;
      renderGrid();
      renderRoutes();
      renderBuildings();

      root.addEventListener(&#x27;click&#x27;, function (event) {
        var hit = event.composedPath().find(function (element) {
          return element &amp;&amp; element.getAttribute &amp;&amp;
            (element.hasAttribute(&#x27;data-edge&#x27;) || element.hasAttribute(&#x27;data-node&#x27;));
        });
        if (!hit) {
          return;
        }
        event.preventDefault();
        if (hit.hasAttribute(&#x27;data-edge&#x27;)) {
          selectEdge(hit.getAttribute(&#x27;data-edge&#x27;));
        } else {

  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)

  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
